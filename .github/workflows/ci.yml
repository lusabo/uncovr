name: Uncovr checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile uncovr.py .github/skills/uncovr/scripts/check.py .github/skills/uncovr/scripts/history.py
      - run: python uncovr.py pack
